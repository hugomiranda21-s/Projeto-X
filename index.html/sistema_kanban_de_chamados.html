<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Chamados - Kanban</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* slate-100 */
        }
        
        /* Estilização da barra de rolagem customizada */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Classes para o Drag and Drop */
        .sortable-ghost {
            opacity: 0.4;
            background-color: #f8fafc;
            border: 2px dashed #94a3b8;
        }
        .drag-over {
            background-color: #e2e8f0; /* slate-200 */
            border: 2px dashed #64748b;
        }
        .task-card {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .task-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-200 px-6 py-4 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg">
                <i class="fa-solid fa-layer-group text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900 leading-tight">Painel de Chamados</h1>
                <p class="text-xs text-slate-500">Gerencie suas demandas de forma ágil</p>
            </div>
        </div>
        <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-sm">
            <i class="fa-solid fa-plus"></i>
            <span class="hidden sm:inline">Novo Chamado</span>
        </button>
    </header>

    <!-- Kanban Board Area -->
    <main class="flex-1 overflow-x-auto overflow-y-hidden p-6">
        <div class="flex h-full gap-6 items-start min-w-max pb-4" id="board">
            
            <!-- Coluna: A Fazer -->
            <div class="kanban-column flex flex-col bg-slate-100 rounded-xl w-80 max-h-full border border-slate-200" data-status="todo">
                <div class="p-4 flex items-center justify-between border-b border-slate-200 shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-slate-400"></div>
                        <h2 class="font-semibold text-slate-700">A Fazer</h2>
                    </div>
                    <span class="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-1 rounded-full count-badge">0</span>
                </div>
                <div class="p-3 flex-1 overflow-y-auto task-container space-y-3 min-h-[150px]" id="col-todo">
                    <!-- Cards vão aqui -->
                </div>
            </div>

            <!-- Coluna: Em Andamento -->
            <div class="kanban-column flex flex-col bg-slate-100 rounded-xl w-80 max-h-full border border-slate-200" data-status="inprogress">
                <div class="p-4 flex items-center justify-between border-b border-slate-200 shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                        <h2 class="font-semibold text-slate-700">Em Andamento</h2>
                    </div>
                    <span class="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-1 rounded-full count-badge">0</span>
                </div>
                <div class="p-3 flex-1 overflow-y-auto task-container space-y-3 min-h-[150px]" id="col-inprogress">
                    <!-- Cards vão aqui -->
                </div>
            </div>

            <!-- Coluna: Em Revisão -->
            <div class="kanban-column flex flex-col bg-slate-100 rounded-xl w-80 max-h-full border border-slate-200" data-status="review">
                <div class="p-4 flex items-center justify-between border-b border-slate-200 shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-purple-500"></div>
                        <h2 class="font-semibold text-slate-700">Em Revisão</h2>
                    </div>
                    <span class="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-1 rounded-full count-badge">0</span>
                </div>
                <div class="p-3 flex-1 overflow-y-auto task-container space-y-3 min-h-[150px]" id="col-review">
                    <!-- Cards vão aqui -->
                </div>
            </div>

            <!-- Coluna: Concluído -->
            <div class="kanban-column flex flex-col bg-slate-100 rounded-xl w-80 max-h-full border border-slate-200" data-status="done">
                <div class="p-4 flex items-center justify-between border-b border-slate-200 shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                        <h2 class="font-semibold text-slate-700">Concluído</h2>
                    </div>
                    <span class="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-1 rounded-full count-badge">0</span>
                </div>
                <div class="p-3 flex-1 overflow-y-auto task-container space-y-3 min-h-[150px]" id="col-done">
                    <!-- Cards vão aqui -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Novo Chamado -->
    <div id="ticketModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800">Criar Novo Chamado</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form id="ticketForm" class="p-6 space-y-4">
                <div>
                    <label for="title" class="block text-sm font-medium text-slate-700 mb-1">Título do Chamado</label>
                    <input type="text" id="title" required placeholder="Ex: Atualizar logo do site..." 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label for="description" class="block text-sm font-medium text-slate-700 mb-1">Descrição Detalhada</label>
                    <textarea id="description" required rows="4" placeholder="Descreva a demanda..." 
                              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
                </div>
                <div class="pt-4 flex gap-3 justify-end">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors shadow-sm">
                        Criar Chamado
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        const STORAGE_KEY = 'kanban_tickets_data';
        let tickets = [];
        let draggedTicketId = null;

        // Referências DOM
        const modal = document.getElementById('ticketModal');
        const modalContent = document.getElementById('modalContent');
        const ticketForm = document.getElementById('ticketForm');
        const columns = document.querySelectorAll('.kanban-column');

        // Mapeamento de cores de borda por status para visual elegante
        const statusColors = {
            todo: 'border-slate-400',
            inprogress: 'border-blue-500',
            review: 'border-purple-500',
            done: 'border-green-500'
        };

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            loadTickets();
            renderBoard();
            setupDragAndDrop();
        });

        // Carregar do Local Storage
        function loadTickets() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    tickets = JSON.parse(saved);
                } catch (e) {
                    tickets = [];
                    console.error("Erro ao carregar tickets");
                }
            } else {
                // Dados de exemplo se for a primeira vez
                tickets = [
                    { id: 't1', title: 'Ajustar layout mobile', description: 'Menu sanduíche não está abrindo em telas menores que 768px.', status: 'todo', date: new Date().toISOString() },
                    { id: 't2', title: 'Integração com API', description: 'Consumir endpoint de usuários para listagem.', status: 'inprogress', date: new Date().toISOString() }
                ];
                saveTickets();
            }
        }

        // Salvar no Local Storage
        function saveTickets() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
        }

        // Renderizar todos os cartões nas colunas corretas
        function renderBoard() {
            // Limpar colunas
            document.querySelectorAll('.task-container').forEach(container => {
                container.innerHTML = '';
            });

            // Contadores de tickets por coluna
            const counts = { todo: 0, inprogress: 0, review: 0, done: 0 };

            tickets.forEach(ticket => {
                const container = document.getElementById(`col-${ticket.status}`);
                if (container) {
                    const card = createCardElement(ticket);
                    container.appendChild(card);
                    counts[ticket.status]++;
                }
            });

            // Atualizar badges
            document.querySelectorAll('.kanban-column').forEach(col => {
                const status = col.dataset.status;
                const badge = col.querySelector('.count-badge');
                if (badge) badge.textContent = counts[status];
            });
        }

        // Criar elemento DOM do Cartão
        function createCardElement(ticket) {
            const div = document.createElement('div');
            div.className = `task-card bg-white p-4 rounded-lg shadow-sm border-l-4 ${statusColors[ticket.status]} border-y border-r border-y-slate-200 border-r-slate-200 cursor-grab relative group`;
            div.draggable = true;
            div.dataset.id = ticket.id;
            
            // Formatar data (simples)
            const dateObj = new Date(ticket.date);
            const dateStr = `${dateObj.getDate().toString().padStart(2, '0')}/${(dateObj.getMonth()+1).toString().padStart(2, '0')}`;

            div.innerHTML = `
                <div class="flex justify-between items-start mb-2 gap-2">
                    <h4 class="font-medium text-slate-800 text-sm leading-tight">${escapeHtml(ticket.title)}</h4>
                    <button onclick="deleteTicket('${ticket.id}')" class="text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity" title="Excluir">
                        <i class="fa-regular fa-trash-can text-xs"></i>
                    </button>
                </div>
                <p class="text-slate-500 text-xs mb-3 line-clamp-2">${escapeHtml(ticket.description)}</p>
                <div class="flex justify-between items-center text-xs text-slate-400 font-medium">
                    <span class="bg-slate-100 px-2 py-1 rounded text-[10px]">#${ticket.id.substring(0,4).toUpperCase()}</span>
                    <span><i class="fa-regular fa-calendar mr-1"></i> ${dateStr}</span>
                </div>
            `;

            // Eventos de Drag específicos do cartão
            div.addEventListener('dragstart', handleDragStart);
            div.addEventListener('dragend', handleDragEnd);

            return div;
        }

        // Adicionar novo Ticket
        ticketForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();

            if (title && description) {
                const newTicket = {
                    id: 'tk-' + Math.random().toString(36).substr(2, 9),
                    title: title,
                    description: description,
                    status: 'todo', // Começa na primeira esteira
                    date: new Date().toISOString()
                };

                tickets.push(newTicket);
                saveTickets();
                renderBoard();
                closeModal();
                ticketForm.reset();
            }
        });

        // Excluir Ticket
        window.deleteTicket = function(id) {
            // Utilizamos um Custom Confirm visualmente agradável se preferível, 
            // mas o nativo resolve para manter tudo em um arquivo leve se necessário.
            // Aqui faremos exclusão direta para manter o fluxo rápido.
            tickets = tickets.filter(t => t.id !== id);
            saveTickets();
            renderBoard();
        };

        // Utilitário contra XSS
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Controle do Modal
        window.openModal = function() {
            modal.classList.remove('hidden');
            // Pequeno delay para animar a opacidade
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                document.getElementById('title').focus();
            }, 10);
        };

        window.closeModal = function() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // Tempo da transição
        };

        // Lógica de Drag and Drop
        function handleDragStart(e) {
            draggedTicketId = this.dataset.id;
            this.classList.add('sortable-ghost');
            // Necessário para Firefox
            if (e.dataTransfer) {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', this.dataset.id);
            }
        }

        function handleDragEnd(e) {
            this.classList.remove('sortable-ghost');
            columns.forEach(col => col.classList.remove('drag-over'));
            draggedTicketId = null;
        }

        function setupDragAndDrop() {
            columns.forEach(column => {
                const container = column.querySelector('.task-container');
                
                column.addEventListener('dragover', e => {
                    e.preventDefault(); // Permite soltar
                    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
                    column.classList.add('drag-over');
                });

                column.addEventListener('dragleave', e => {
                    // Remove highlight apenas se sair da coluna inteira
                    if (!column.contains(e.relatedTarget)) {
                        column.classList.remove('drag-over');
                    }
                });

                column.addEventListener('drop', e => {
                    e.preventDefault();
                    column.classList.remove('drag-over');
                    
                    const newStatus = column.dataset.status;
                    
                    // Atualiza estado
                    if (draggedTicketId) {
                        const ticketIndex = tickets.findIndex(t => t.id === draggedTicketId);
                        if (ticketIndex > -1 && tickets[ticketIndex].status !== newStatus) {
                            tickets[ticketIndex].status = newStatus;
                            saveTickets();
                            renderBoard();
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
